<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Λα.Το.40</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <div class="logo">✝</div>

            <div>
                <h1>Λατρευτικός Τομέας</h1>
                <p>Επιλέξτε ένα εγκόλπιο για δανεισμό</p>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="toolbar">
            <label class="search-box">
                <span class="search-icon">🔍</span>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Αναζήτηση με τίτλο ή κατηγορία"
                    autocomplete="off"
                >
            </label>

            <select id="categoryFilter" aria-label="Filter by category">
                <option value="all">Όλες οι κατηγορίες</option>
            </select>
        </section>

        <section class="summary">
            <p id="resultsText">Φόρτωση εγκολπίων...</p>
        </section>

        <section
            id="engolpiaGrid"
            class="engolpia-grid"
            aria-live="polite"
        ></section>

        <section id="emptyState" class="empty-state hidden">
            <div class="empty-icon">📭</div>
            <h2>Δεν βρέθηκαν εγκόλπια</h2>
            <p>Δοκιμάστε άλλον τίτλο ή κατηγορία.</p>
        </section>
    </main>

    <dialog id="borrowDialog" class="borrow-dialog">
        <form id="borrowForm">
            <button
                type="button"
                id="closeDialogButton"
                class="close-button"
                aria-label="Κλείσιμο"
            >
                ×
            </button>

            <div class="dialog-heading">
                <p class="dialog-label">Δανεισμός</p>
                <h2 id="dialogTitle">Εγκόλπιο</h2>
            </div>

            <input type="hidden" id="selectedEngolpioId">

            <label class="form-field">
                <span>Ονοματεπώνυμο</span>

                <input
                    type="text"
                    id="borrowerName"
                    required
                    placeholder="π.χ. Ιωάννης Παπαδόπουλος"
                    autocomplete="name"
                >
            </label>

            <label class="form-field">
                <span>Αριθμός εγκολπίου</span>

                <input
                    type="number"
                    id="copyNumber"
                    required
                    min="1"
                    step="1"
                    placeholder="π.χ. 4"
                >
            </label>


            <p id="formMessage" class="form-message"></p>

            <button type="submit" class="primary-button">
                Επιβεβαίωση δανεισμού
            </button>
        </form>
    </dialog>

    <dialog id="returnDialog" class="borrow-dialog">
        <form id="returnForm">
            <button
                type="button"
                id="closeReturnDialogButton"
                class="close-button"
                aria-label="Κλείσιμο"
            >
                &times;
            </button>

            <div class="dialog-heading">
                <p class="dialog-label">Επιστροφή</p>
                <h2 id="returnDialogTitle">Εγκόλπιο</h2>
            </div>

            <input
                type="hidden"
                id="returnEngolpioId"
            >

            <label class="form-field">
                <span>Αριθμός εγκολπίου</span>

                <input
                    type="number"
                    id="returnCopyNumber"
                    required
                    min="1"
                    step="1"
                    placeholder="π.χ. 4"
                >
            </label>

            <p
                id="returnFormMessage"
                class="form-message"
            ></p>

            <button
                type="submit"
                class="primary-button"
            >
                Επιβεβαίωση επιστροφής
            </button>
        </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>

    <script src="script.js"></script>
</body>
</html>
